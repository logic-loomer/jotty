# Claude code review on pull requests (CI-02).
#
# Runs the official code-review plugin and posts findings as inline comments.
# Billing: secrets.ANTHROPIC_API_KEY is a key from Awon's Individual Org, the Console
# org that receives the Ultra plan's monthly API credits.
#
# Public repo safety: only PRs from branches in this repo run it. GitHub withholds
# secrets from fork PRs anyway; the `if` makes the skip explicit instead of a red run.
# Drafts are skipped; the review runs when the PR is marked ready.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
